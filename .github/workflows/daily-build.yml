name: Build Node C

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node C
        run: |
          set -euo pipefail
          mkdir -p raw_data public

          python scripts/fetch_feeds.py \
            --report raw_data/source_report.tsv \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_ZA1.xml.gz" "raw_data/share_za.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_NG1.xml.gz" "raw_data/share_ng.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz" "raw_data/share_ae.xml" \
            --feed "https://epg.pw/xmltv/epg_ZA.xml.gz" "raw_data/pw_za.xml"

          # fetch_feeds.py validates each source independently and removes
          # rejected feeds, allowing the remaining usable sources to continue.
          python scripts/build_db.py public/c.sqlite3

      - name: Upload database artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epg-database
          path: public/*.sqlite3
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
