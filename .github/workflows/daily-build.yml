name: Build Node C

on:
  push:
    branches:
      - codex/validate-epg-build-2026-11-10
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node C
        run: |
          mkdir -p raw_data public
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_ZA1.xml.gz" | gunzip > raw_data/share_za.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_NG1.xml.gz" | gunzip > raw_data/share_ng.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz" | gunzip > raw_data/share_ae.xml
          curl -L --fail "https://epg.pw/xmltv/epg_ZA.xml.gz" | gunzip > raw_data/pw_za.xml
          python scripts/build_db.py public/c.sqlite3
          python scripts/validate_db.py public/c.sqlite3

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
